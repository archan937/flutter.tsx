name: Pages

# The site is the docs directory, generated from the SDK snapshot and the
# conformance fixtures, and gated by CI: `bun run quality` fails if any page
# differs from a fresh render, so what would publish is always current.
#
# It publishes after CI has passed on master, so a page can never describe a
# build that did not — and can be run by hand for the first deploy.
on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Provisions the Pages site rather than requiring it to exist first,
      # for the run that publishes it the first time.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
